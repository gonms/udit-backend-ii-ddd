services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: proyecto_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - proyecto_network
    depends_on:
      - mysql

  nginx:
    image: nginx:1.27-alpine
    container_name: proyecto_nginx
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - proyecto_network
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: proyecto_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: test
      MYSQL_ROOT_PASSWORD: test
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - proyecto_network

  mailer: 
    container_name: proyecto_mailer
    image: 'axllent/mailpit:latest'
    ports:
        - '1025:1025'
        - '8025:8025'
    networks:
        - proyecto_network

networks:
  proyecto_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local